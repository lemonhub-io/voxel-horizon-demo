name = "voxel-horizon-mp"
main = "src/index.ts"
compatibility_date = "2025-04-07"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787

[[durable_objects.bindings]]
name = "PLANET_ROOM"
class_name = "PlanetRoom"

[[durable_objects.bindings]]
name = "ROOM_DIRECTORY"
class_name = "RoomDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlanetRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomDirectory"]
